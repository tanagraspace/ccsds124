[package]
name = "ccsds124"
version = "1.0.0"
edition = "2021"
authors = ["Tanagra Space"]
description = "CCSDS 124.0-B-1 lossless compression algorithm"
license = "MIT"
repository = "https://github.com/tanagraspace/ccsds124"
keywords = ["compression", "ccsds", "space", "housekeeping", "telemetry"]
categories = ["compression", "aerospace"]
rust-version = "1.70"

[dependencies]
# No dependencies - standard library only

[[bin]]
name = "ccsds124"
path = "src/bin/ccsds124.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Exclude CLI, benchmarks, and tests from coverage
[package.metadata.tarpaulin]
exclude-files = ["src/bin/*", "tests/*"]
